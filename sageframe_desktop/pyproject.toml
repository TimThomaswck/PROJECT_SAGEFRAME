[project]
name = "sageframe_desktop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "packaging>=25.0",
    "qasync>=0.28.0",
    "glom>=24.11.0",
    "pyside6>=6.1.3",
    "singleton-decorator>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pyqtgraph>=0.13.3",
    "PyPDF2>=3.0.0",
    "pdf2image>=1.16.3",
    "Pillow>=10.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    "keyring>=24.0.0",
    "aiohttp>=3.9.0",
    "python-dateutil>=2.8.0",
    # "pyqtdarktheme-fork>=2.3.4",
]

[dependency-groups]
dev = [
    "nuitka>=2.8.1",
    "pyinstaller>=6.16.0",
    "pyside-cli>=1.0.0",
    "pytest>=8.3.5",
    "pytest-qt>=4.4.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "toml>=0.10.2",
]

[tool.pyside-cli]
# Nuitka build options
# Some options are configured for CI and tool, DO NOT CHANGE:
# --output-dir, --output-filename, --product-version
quiet = true
assume-yes-for-downloads = true
enable-plugins = ["pyside6"]
nofollow-import-to = [
    "unittest",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "PySide6.QtAsyncio",
    "PySide6.QtNetwork",
    "PySide6.QtNetworkAuth",
]
noinclude-qt-plugins = ["tls"]

[tool.pyside-cli.win32]
# Nuitka build options for {sys.platform}
windows-console-mode = "disable"
windows-icon-from-ico = "app/assets/logo.ico"
noinclude-dlls = ["qt6network.dll"]

[tool.pyside-cli.linux]
linux-icon = "app/assets/logo.ico"
noinclude-dlls = ["libQt6Network.so.6"]

[tool.pyside-cli.pyinstaller]
# PyInstaller build options
# Some options are configured for CI and tool, DO NOT CHANGE:
# --distpath, --workpath, --specpath, --name
windowed = true
icon = "app/assets/logo.ico"

[tool.pyside-cli.i18n]
# Default language is en_US where defined in *.ui and *.py files.
# Exclude the app/resources/*.py.
languages = ["zh_CN"]

[tool.pytest.ini_options]
testpaths = [
    "app/test",
    "app/core/tests",
    "app/ui/tests",
]

[project.scripts]
App = "app.__main__:run_module"
AppNoUpdater = "app.__main__:main_no_updater"
QmlDemo = "qml_demo.__main__:main"

# build sources wheel
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*", "qml_demo", "qml_demo.*"]
exclude = ["app.test", "app.test.*"]
